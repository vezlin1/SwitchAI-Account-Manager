<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SwitchAI Account Manager</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07090e;
        color: #f3f4f6;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        width: 100vw;
        height: 100vh;
        background-color: #07090e;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07090e; color: #9ca3af; font-family: system-ui, -apple-system, sans-serif; user-select: none;">
        <div style="width: 28px; height: 28px; border: 2px solid rgba(96, 165, 250, 0.2); border-top-color: #60a5fa; border-radius: 50%; animation: vg-spin 0.8s linear infinite; margin-bottom: 12px;"></div>
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.02em; color: #6b7280;">Loading SwitchAI...</div>
      </div>
    </div>
    <style>
      @keyframes vg-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
